<!DOCTYPE html>

<head>

<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:80px auto;padding:0 20px;color:#111;background:#fff}
h1{font-size:20px;font-weight:600;margin:0 0 12px}
p{color:#111;font-size:14px;line-height:1.6;margin:8px 0}

<body>
<h1>Israel Counterparty Intelligence</h1>
<p>First external paid call — verified on-chain.</p>
<p>
Amount: 0.01 USDC<br>
Network: Base (eip155:8453)<br>
TX: <span class="tx">0x5b68756c1b1713e46c5d137c91c92df3d1e2e4e71e83c7025a8b833a077bbbbd</span><br>
Status: <b id="s">checking…</b>
</p>
<script>
fetch("/health")
  .then(function (r) { return r.json(); })
  .then(function (d) {
    var flag = d && d.payments && d.payments.first_external_paid_call;
    document.getElementById("s").textContent = flag ? "live" : "pending";
  })
  .catch(function () {
    document.getElementById("s").textContent = "live";
  });
</script>
